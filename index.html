<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuditCheck | Autoavaliação de segurança</title>
<meta name="description" content="Autoavaliação acadêmica de segurança da informação baseada na ISO/IEC 27001 e na LGPD.">
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#18283d;background:#f2f5fa;--navy:#101d33;--blue:#2358db;--line:#e1e8f2;--muted:#52647b}*{box-sizing:border-box}body{margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;font-weight:650}button:focus-visible,a:focus-visible{outline:3px solid #e9a721;outline-offset:3px}.primary{background:var(--blue);color:white}.soft{background:#eaf0ff;color:#1c46b3}.danger{background:#fff0ed;color:#a13628}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}aside{background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:30px}.brand{font-size:24px;font-weight:780;display:flex;align-items:center;gap:10px}.mark{background:#4b76f5;border-radius:10px;padding:4px 9px;color:white}nav{display:grid;gap:6px}nav button{background:transparent;color:#ccd8eb;text-align:left;font-size:15px}nav button[aria-current=page]{background:#284273;color:white}aside small{margin-top:auto;color:#b9c9df;padding:12px}main{width:100%;max-width:1400px;margin:auto;padding:28px clamp(16px,4vw,56px) 50px;align-self:start}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top{padding-bottom:22px;font-size:14px;color:var(--muted)}.hero{background:linear-gradient(112deg,#15274c,#244a9b);border-radius:18px;padding:clamp(22px,4vw,42px);color:white;display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:22px}.hero p{color:#dce8ff;margin-bottom:0}.hero button{background:white;color:#204cb9}.eyebrow{font-size:13px;letter-spacing:.13em;font-weight:750;text-transform:uppercase}h1{font-size:clamp(31px,4vw,49px);line-height:1.04;margin:10px 0 14px;letter-spacing:-.04em}h2{margin:0 0 12px;font-size:21px;letter-spacing:-.025em}h3{margin:0 0 6px;font-size:17px}p{line-height:1.55}small,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:17px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}.metric strong{display:block;font-size:33px;letter-spacing:-.055em;margin:6px 0}.metric small{font-size:13px}.section{margin-bottom:20px}.bar{height:9px;background:#e9eef8;border-radius:9px;overflow:hidden;margin-top:7px}.bar span{display:block;background:#3566eb;height:100%;border-radius:9px}.chart{margin-top:16px}.chart .row{font-size:14px}.item{border-top:1px solid var(--line);padding:14px 0}.item:last-child{padding-bottom:0}.pill{display:inline-block;background:#eaf0ff;color:#244bb0;border-radius:20px;padding:5px 9px;font-size:13px;font-weight:650}.high{background:#ffebe6;color:#9c3323}.medium{background:#fff0ce;color:#754a00}.form{display:grid;gap:14px}.form label,.question label{display:grid;gap:6px;font-weight:600}.form input,.form textarea,.question select,.question input,.action input,.action select{width:100%;border:1px solid #c8d4e5;border-radius:8px;background:#fff;padding:10px;color:inherit}.question,.action{margin-bottom:12px}.question details{margin-top:12px}.question p,.action p{margin:8px 0 12px}.question summary{cursor:pointer;color:#2554bc}textarea{min-height:90px;resize:vertical}.notice{background:#eaf0ff;color:#234182;border-radius:9px;padding:12px 16px;margin-bottom:16px}.links a{color:#204cb9}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks input{width:auto}.checks label{display:flex;gap:5px;align-items:center}.chart b{font-variant-numeric:tabular-nums}.risk{margin-top:6px}.print{display:none}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}aside{padding:15px;gap:12px}aside small{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px 10px}main{padding-top:16px}.two{grid-template-columns:1fr}.card{padding:15px}}
@media print{body{background:white;color:black}.shell{display:block}aside,main,.screen{display:none!important}.print{display:block;font-size:11pt}.print h1{font-size:26pt}.print article{break-inside:avoid;border-top:1px solid #aaa;padding:8pt 0}.print p{margin:4pt 0}.print a{color:inherit}}
</style></head>
<body><div class="shell"><aside><div class="brand"><span class="mark" aria-hidden="true">✓</span> AuditCheck</div><nav aria-label="Seções"></nav><small>Projeto 5 · Autoavaliação<br>ISO/IEC 27001 e LGPD</small></aside><main id="main"><div class="top"><span>Segurança da informação / <b id="section"></b></span><span class="pill" id="mode"></span></div><div id="status" role="status"></div><div id="view"></div></main></div><div id="print" class="print"></div>
<script>
"use strict";
const domains = ["Governança", "Acesso e autenticação", "Backups", "Proteção de dados", "Incidentes"];
const catalog = [
 [0,"Escopo do SGSI","ISO/IEC 27001 §4.3",2,"O escopo do SGSI identifica unidades, processos, sistemas e dependências?","Ativos críticos fora da avaliação","Documentar limites, dependências e interfaces e aprovar o escopo.","Escopo revisado e aprovado"],
 [0,"Tratamento de riscos","ISO/IEC 27001 §6.1.2–6.1.3",3,"A organização avalia riscos e mantém um plano de tratamento com responsáveis?","Riscos relevantes sem tratamento","Definir critérios, registrar riscos e aprovar o tratamento e o risco residual.","Registro e plano aprovados"],
 [0,"Auditoria interna","ISO/IEC 27001 §9.2",1,"Existe um programa de auditoria interna com resultados registrados?","Falhas de controle sem verificação periódica","Definir frequência, escopo e critérios e executar uma auditoria piloto.","Programa e relatório da auditoria"],
 [1,"Revisão de acessos","ISO/IEC 27001 A.5.18",3,"Os acessos são concedidos, revisados e revogados conforme a função e o desligamento?","Contas com acesso indevido","Revisar acessos por função e integrar a revogação ao desligamento.","Amostra de acessos e revogações revisada"],
 [1,"Autenticação segura","ISO/IEC 27001 A.8.5",3,"O acesso privilegiado e remoto usa autenticação reforçada compatível com o risco?","Uso indevido de credenciais","Aplicar MFA ao acesso privilegiado e remoto e revisar exceções.","Contas em escopo com MFA verificado"],
 [2,"Cópias de segurança","ISO/IEC 27001 A.8.13",3,"Os dados críticos têm cópias com frequência, retenção e proteção definidas?","Perda de dados críticos","Definir política de cópias e monitorar a execução para ativos críticos.","Histórico de execução revisado"],
 [2,"Teste de restauração","ISO/IEC 27001 A.8.13",3,"A organização testa restaurações e registra tempo e integridade dos dados recuperados?","Recuperação inviável após falha","Simular restauração de dados críticos e comparar o resultado com os objetivos de recuperação.","Relatório de teste de recuperação"],
 [3,"Registros de tratamento","LGPD art. 37",2,"Existe registro atualizado das operações de tratamento aplicáveis ao escopo?","Tratamentos sem rastreabilidade","Inventariar operações e registrar finalidades, dados, responsáveis e fluxos.","Inventário revisado"],
 [3,"Direitos dos titulares","LGPD art. 18",2,"Há fluxo para receber, validar e responder a pedidos dos titulares?","Solicitações sem atendimento adequado","Definir canal, responsáveis e procedimento para verificar e atender pedidos.","Pedido simulado tratado de ponta a ponta"],
 [3,"Proteção de dados pessoais","LGPD art. 46 · ISO/IEC 27001 A.8.24",3,"Há medidas técnicas e administrativas proporcionais ao risco, incluindo proteção criptográfica quando cabível?","Exposição ou alteração de dados pessoais","Rever controles de acesso, criptografia e gestão de chaves para dados sensíveis.","Amostra de dados e controles verificada"],
 [4,"Resposta a incidentes","ISO/IEC 27001 A.5.24 e A.5.26",3,"Existe procedimento exercitado para triagem, resposta e registro de incidentes?","Resposta tardia e impacto ampliado","Definir papéis, fluxo de escalonamento e realizar um exercício de resposta.","Ata e resultados do exercício"],
 [4,"Comunicação de incidentes","LGPD art. 48",3,"O controlador tem processo para avaliar risco ou dano relevante e comunicar incidentes quando cabível?","Comunicação obrigatória atrasada ou omitida","Definir responsáveis e testar o fluxo de decisão e comunicação à ANPD e aos titulares quando aplicável.","Simulação com decisão e registro da comunicação"]
].map(([domain,title,ref,weight,prompt,risk,fix,check],i)=>({id:i,domain,title,ref,weight,prompt,risk,fix,check}));
const opts = {"":"Selecione uma resposta","0":"0 · Inexistente","1":"1 · Informal","2":"2 · Parcial","3":"3 · Implementado","4":"4 · Monitorado","na":"Não aplicável"};
const pages = ["Visão geral","Organização","Questionário","Plano PDCA","Relatório","Metodologia"];
const stages = ["Planejar","Executar","Verificar","Agir"];
const storageKey = "auditcheck-v1";
const fresh = () => ({demo:false,org:{name:"",sector:"",owner:"",scope:""},answers:{},actions:{}});
function sample(){
 const data = fresh();
 data.demo=true;
 data.org={name:"Aurora Serviços Digitais",sector:"Tecnologia",owner:"Equipe de segurança",scope:"Ambiente de atendimento digital, infraestrutura em nuvem e tratamento de dados de clientes."};
 [3,2,3,3,1,4,1,3,3,2,3,2].forEach((value,id)=>data.answers[id]={value:String(value)});
 data.answers[5].evidence="SIM-BKP-01 · Registro fictício de execução diária das cópias.";
 return data;
}
let data;
try {data=JSON.parse(localStorage.getItem(storageKey)) || sample()} catch {data=sample()}
let page=0; let filter="all";
const byId=id=>document.getElementById(id);
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const answer=id=>data.answers[id]||{};
const action=id=>data.actions[id]||{};
const isAnswered=q=> Boolean(answer(q.id).value) && (answer(q.id).value!=="na" || Boolean(answer(q.id).reason?.trim()));
const applicable=q=>isAnswered(q)&&answer(q.id).value!=="na";
function score(list){
 const items=list.filter(applicable);
 const max=items.reduce((total,q)=>total+4*q.weight,0);
 return max ? Math.round(100*items.reduce((total,q)=>total+q.weight*Number(answer(q.id).value),0)/max) : null;
}
function level(n){return n===null?"Sem pontuação":n<20?"Inicial":n<40?"Em desenvolvimento":n<60?"Definido":n<80?"Gerenciado":"Otimizado"}
function findings(){
 return catalog.filter(q=>applicable(q)&&Number(answer(q.id).value)<3).map(q=>({...q,priority:q.weight*(3-Number(answer(q.id).value))})).sort((a,b)=>b.priority-a.priority||a.id-b.id);
}
const severity=n=>n>=6?"Alta":n>=3?"Média":"Baixa";
const badge=n=>'<span class="pill '+(n>=6?"high":n>=3?"medium":"")+'">'+severity(n)+'</span>';
const pct=n=>n===null?"—":n+"%";
const progress=(n,label)=>'<div class="bar" role="progressbar" aria-label="'+label+'" aria-valuenow="'+n+'"><span style="width:'+n+'%"></span></div>';
function save(){
 try {localStorage.setItem(storageKey,JSON.stringify(data)); byId("status").innerHTML=""}
 catch {byId("status").innerHTML='<div class="notice">Armazenamento indisponível. As alterações ficam disponíveis até fechar ou recarregar esta página.</div>'}
}
function dashboard(){
 const n=score(catalog), done=catalog.filter(isAnswered).length, issues=findings();
 const metric=(name,value,hint)=>'<div class="card metric"><span>'+name+'</span><strong>'+value+'</strong><small>'+hint+'</small></div>';
 return '<div class="hero"><div><div class="eyebrow">Autoavaliação de segurança</div><h1>Visão geral</h1><p>'+escapeHtml(data.org.name||"Organização sem cadastro")+'</p></div><button data-page="2">Abrir questionário</button></div>'+
 '<div class="grid">'+metric("Score de maturidade",pct(n),level(n)+(done<catalog.length&&n!==null?" · provisório":""))+
 metric("Controles respondidos",done+" / "+catalog.length,"Inclui N/A justificados")+metric("Possíveis não conformidades",issues.length,"Respostas de nível 0 a 2")+metric("Prioridade alta",issues.filter(q=>q.priority>=6).length,"Achados a verificar")+'</div>'+
 '<div class="split"><section class="card"><h2>Maturidade por domínio</h2>'+domains.map((name,i)=>{
 const value=score(catalog.filter(q=>q.domain===i));
 return '<div class="chart"><div class="row"><span>'+name+'</span><b>'+pct(value)+'</b></div>'+(value===null?"":progress(value,name))+'</div>';
 }).join("")+'</section><section class="card"><div class="row"><h2>Achados prioritários</h2><button class="soft" data-page="3">Ver plano</button></div>'+
 (issues.length?issues.slice(0,4).map(q=>'<div class="item"><div class="row"><h3>'+q.title+'</h3>'+badge(q.priority)+'</div><small>'+q.risk+'</small></div>').join(""):'<p class="muted">Nenhum achado nas respostas registradas.</p>')+'</section></div>';
}
function organization(){
 return '<h1>Organização e escopo</h1><form id="org" class="card form"><div class="two"><label>Nome da organização<input required name="name" maxlength="150" value="'+escapeHtml(data.org.name)+'"></label><label>Setor<input name="sector" maxlength="100" value="'+escapeHtml(data.org.sector)+'"></label></div><label>Responsável pela avaliação<input name="owner" maxlength="120" value="'+escapeHtml(data.org.owner)+'"></label><label>Escopo da avaliação<textarea name="scope" required maxlength="1800" placeholder="Unidades, processos e sistemas abrangidos">'+escapeHtml(data.org.scope)+'</textarea></label><div><button class="primary">Salvar cadastro</button></div></form><section class="card section" style="margin-top:16px"><h2>Dados da avaliação</h2><div class="row"><button class="soft" data-command="sample">Carregar demonstração</button><button class="danger" data-command="reset">Iniciar avaliação em branco</button></div></section>';
}
function questionnaire(){
 return '<div class="row"><h1>Questionário</h1><label>Domínio <select id="filter"><option value="all">Todos</option>'+domains.map((name,i)=>'<option value="'+i+'" '+(filter===String(i)?"selected":"")+'>'+name+'</option>').join("")+'</select></label></div><p class="muted" id="coverage"></p>'+
 catalog.filter(q=>filter==="all"||Number(filter)===q.domain).map(q=>{
 const a=answer(q.id);
 return '<article class="card question"><div class="row"><h2>'+q.title+'</h2><span class="pill">'+q.ref+'</span></div><p>'+q.prompt+'</p><label>Nível de implementação<select data-answer="'+q.id+'" data-field="value">'+Object.entries(opts).sort(([a],[b])=>a===""?-1:b===""?1:0).map(([value,label])=>'<option value="'+value+'" '+((a.value||"")===value?"selected":"")+'>'+label+'</option>').join("")+'</select></label>'+
 '<div data-reason="'+q.id+'" '+(a.value==="na"?"":"hidden")+'><label>Justificativa de não aplicabilidade<input maxlength="500" data-answer="'+q.id+'" data-field="reason" value="'+escapeHtml(a.reason)+'"></label></div>'+
 '<details><summary>Evidência simulada</summary><label>Referência ou descrição fictícia<input maxlength="500" data-answer="'+q.id+'" data-field="evidence" value="'+escapeHtml(a.evidence)+'" placeholder="Ex.: SIM-01 · Registro fictício de revisão"></label></details></article>';
 }).join("");
}
function plan(){
 const issues=findings();
 return '<h1>Plano de ação PDCA</h1><p class="muted">As ações partem dos achados da autoavaliação. Defina responsáveis e prazos e registre o avanço em cada etapa.</p>'+
 (issues.length?issues.map(q=>{
 const a=action(q.id);
 return '<article class="card action"><div class="row"><h2>'+q.title+'</h2>'+badge(q.priority)+'</div><small>'+q.ref+' · Pontuação de prioridade '+q.priority+'</small><p><b>Risco potencial</b> · '+q.risk+'</p><p><b>Recomendação</b> · '+q.fix+'</p><p><b>Critério de verificação</b> · '+q.check+'</p><p><b>Após verificar</b> · Padronizar a medida se eficaz ou revisar o plano.</p><div class="two"><label>Responsável<input maxlength="120" data-action="'+q.id+'" data-field="owner" value="'+escapeHtml(a.owner)+'"></label><label>Prazo<input type="date" data-action="'+q.id+'" data-field="due" value="'+escapeHtml(a.due)+'"></label></div><p class="checks">'+stages.map((name,i)=>'<label><input type="checkbox" data-action="'+q.id+'" data-field="stage'+i+'" '+(a["stage"+i]?"checked":"")+'>'+name+'</label>').join("")+'</p></article>';
 }).join(""):'<div class="card">Nenhuma ação corretiva gerada para as respostas atuais.</div>');
}
const iso="https://www.iso.org/standard/27001";
const lgpd="https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709compilado.htm";
const sources='<p class="links"><a href="'+iso+'" target="_blank" rel="noopener">ISO/IEC 27001:2022</a> · <a href="'+lgpd+'" target="_blank" rel="noopener">Lei nº 13.709/2018 · LGPD</a></p>';
const method='<p>O score é o percentual arredondado de Σ(nível × peso) ÷ Σ(4 × peso). Os pesos 1, 2 e 3 representam a relevância atribuída a cada item neste projeto. Respostas pendentes e itens não aplicáveis com justificativa ficam fora do cálculo. Qualquer pendência torna o score provisório.</p><p>Níveis de resposta · 0 inexistente, 1 informal, 2 parcial, 3 implementado e 4 monitorado. Faixas de maturidade · 0–19 inicial, 20–39 em desenvolvimento, 40–59 definido, 60–79 gerenciado e 80–100 otimizado.</p><p>Respostas entre 0 e 2 geram possíveis não conformidades. A prioridade indicativa é peso × (3 − nível): alta a partir de 6, média de 3 a 5 e baixa abaixo de 3. Os achados exigem verificação no contexto da organização.</p>';
const purpose='<p>Instrumento acadêmico de autoavaliação, com recorte de 12 critérios. A pontuação é própria do AuditCheck e o resultado tem finalidade diagnóstica.</p>';
function methodology(){return '<h1>Metodologia</h1><div class="card">'+purpose+method+sources+'<p>As evidências são descrições simuladas. O cadastro, as respostas e o plano ficam no armazenamento local deste navegador.</p></div>'}
function report(){
 return '<h1>Relatório de autoavaliação</h1><div class="card"><h2>'+escapeHtml(data.org.name||"Organização sem cadastro")+'</h2><p>'+escapeHtml(data.org.scope||"Escopo pendente")+'</p><p>O relatório inclui escopo, metodologia, score por domínio, respostas, evidências simuladas, possíveis não conformidades e plano PDCA.</p><button class="primary" data-command="print">Gerar PDF</button><p class="muted">Na janela de impressão, selecione “Salvar como PDF”.</p></div>';
}
function printReport(){
 const n=score(catalog), done=catalog.filter(isAnswered).length;
 const issues=findings();
 byId("print").innerHTML='<h1>AuditCheck · Relatório de autoavaliação</h1><p>'+new Date().toLocaleDateString("pt-BR")+' · '+(data.demo?"Demonstração fictícia":"Autoavaliação")+'</p><h2>'+escapeHtml(data.org.name||"Organização sem cadastro")+'</h2><p><b>Setor</b> · '+escapeHtml(data.org.sector||"—")+' · <b>Responsável</b> · '+escapeHtml(data.org.owner||"—")+'</p><p><b>Escopo</b> · '+escapeHtml(data.org.scope||"Pendente")+'</p><p><b>Maturidade</b> · '+pct(n)+' · '+level(n)+(done<catalog.length&&n!==null?" · provisório":"")+' · '+done+'/'+catalog.length+' respondidos</p>'+
 '<ul>'+domains.map((name,i)=>'<li>'+name+' · '+pct(score(catalog.filter(q=>q.domain===i)))+'</li>').join("")+'</ul>'+purpose+method+sources+
 '<h2>Respostas e evidências</h2>'+catalog.map(q=>{const a=answer(q.id);return '<article><b>'+q.title+'</b> · '+q.ref+' · Peso '+q.weight+'<p>'+q.prompt+'</p><p>'+(isAnswered(q)?opts[a.value]:"Pendente")+(a.value==="na"&&a.reason?" · "+escapeHtml(a.reason):"")+'</p>'+(a.evidence?'<p>Evidência simulada · '+escapeHtml(a.evidence)+'</p>':"")+'</article>'}).join("")+
 '<h2>Achados e plano PDCA</h2>'+(issues.length?issues.map(q=>{const a=action(q.id);return '<article><b>'+q.title+'</b> · '+severity(q.priority)+' ('+q.priority+')<p>Possível não conformidade · '+opts[answer(q.id).value]+'</p><p>Risco potencial · '+q.risk+'</p><p>Planejar e executar · '+q.fix+'</p><p>Verificar · '+q.check+'</p><p>Agir · Padronizar se eficaz ou revisar o plano.</p><p>Responsável · '+escapeHtml(a.owner||"A definir")+' · Prazo · '+escapeHtml(a.due||"A definir")+'</p><p>Etapas concluídas · '+(stages.filter((_,i)=>a["stage"+i]).join(", ")||"Nenhuma")+'</p></article>'}).join(""):'<p>Nenhum achado nas respostas registradas.</p>');
 window.print();
}
function updateCoverage(){
 const el=byId("coverage");
 if(el) el.textContent=catalog.filter(isAnswered).length+" de "+catalog.length+" respondidos · N/A exige justificativa";
}
function render(){
 document.querySelector("nav").innerHTML=pages.map((name,i)=>'<button data-page="'+i+'" '+(page===i?'aria-current="page"':"")+'>'+name+'</button>').join("");
 byId("section").textContent=pages[page];
 byId("mode").textContent=data.demo?"Dados de demonstração":"Avaliação local";
 byId("view").innerHTML=[dashboard,organization,questionnaire,plan,report,methodology][page]();
 updateCoverage();
}
document.addEventListener("click",event=>{
 const button=event.target.closest("button");
 if(!button)return;
 if(button.dataset.page!==undefined){page=Number(button.dataset.page);render();window.scrollTo(0,0);byId("view").querySelector("h1").setAttribute("tabindex","-1");byId("view").querySelector("h1").focus();}
 const command=button.dataset.command;
 if(command==="print")printReport();
 if((command==="sample"||command==="reset")&&window.confirm("Substituir os dados desta avaliação?")){
   data=command==="sample"?sample():fresh();filter="all";page=command==="sample"?0:1;save();render();
 }
});
document.addEventListener("submit",event=>{
 if(event.target.id!=="org")return;
 event.preventDefault();
 const values=Object.fromEntries([...new FormData(event.target)].map(([name,value])=>[name,value.trim()]));
 if(!values.name||!values.scope){byId("status").innerHTML='<div class="notice">Preencha o nome e o escopo da avaliação.</div>';return}
 data.org=values;save();
 if(!byId("status").textContent)byId("status").innerHTML='<div class="notice">Cadastro salvo neste navegador.</div>';
});
function updateField(event){
 const el=event.target;
 const {answer:id,action:key,field}=el.dataset;
 if(id!==undefined){
   (data.answers[id]??={})[field]=el.value;
   if(field==="value")document.querySelector('[data-reason="'+id+'"]').hidden=el.value!=="na";
   updateCoverage();save();
 }
 if(key!==undefined){
   (data.actions[key]??={})[field]=el.type==="checkbox"?el.checked:el.value;
   save();
 }
}
